services:
  nextcloud_db:
    image: postgres:18-bookworm
    hostname: nextcloud_db
    container_name: nextcloud_db
    restart: always
    volumes:               
     - ./database:/var/lib/postgresql
    env_file: .env   
    networks:            
      - nextcloud_db      

  nextcloud_redis:
    container_name: nextcloud_redis
    hostname: nextcloud_redis
    image: redis:7.4
    restart: always
    networks:
      - nextcloud_db

  nextcloud_app:  
    container_name: nextcloud_app
    hostname: nextcloud_app
    image: nextcloud:33
    restart: always
    ports:
      - 8090:80
    depends_on:
      - nextcloud_db
    volumes:
      - ./data/www/html:/var/www/html
    environment:
      # Pas de fichiers d'exemple dans le dossier des nouveaux utilisateurs
      - NC_skeletondirectory=
    networks:
      - nextcloud_db
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.nextcloud.tls.certresolver=myresolver"
      - "traefik.http.routers.nextcloud.rule=Host(`nuage.$DOMAIN`)"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      # Une seule ligne : deux labels "middlewares" sur le meme router, le second ecrase le premier.
      - "traefik.http.routers.nextcloud.middlewares=nextcloud_custom_header, nextcloud_redirectregex, crowdsec@file"

        # HSTS uniquement. Pas de contentSecurityPolicy ici : Traefik REMPLACERAIT
        # la CSP complete de Nextcloud (qui gere deja frame-ancestors et le
        # frame-src d'OnlyOffice).
      - "traefik.http.middlewares.nextcloud_custom_header.headers.customResponseHeaders.Strict-Transport-Security=max-age=15552000; includeSubDomains; preload;"

        # redirection nécéssaire au desktop client et autres webdav
      - "traefik.http.middlewares.nextcloud_redirectregex.redirectregex.permanent=true"
      - "traefik.http.middlewares.nextcloud_redirectregex.redirectregex.regex=https://(.*)/.well-known/(?:card|cal)dav"
      - "traefik.http.middlewares.nextcloud_redirectregex.redirectregex.replacement=https://$${1}/remote.php/dav"

  onlyoffice:
    container_name: onlyoffice
    hostname: onlyoffice
    # 10.0 : suit les correctifs 10.0.x (make update). Avant de passer en 10.1
    # ou 11, verifier que le connecteur (app onlyoffice de Nextcloud) la supporte.
    image: onlyoffice/documentserver:10.0
    restart: always
    networks:
      - frontend
    environment:
      # Cle partagee avec Nextcloud : la meme valeur est poussee dans l'app
      # onlyoffice par scripts/onlyoffice_connect.sh (make onlyoffice).
      JWT_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit etre renseigne dans .env}
      JWT_HEADER: Authorization
      ENABLE_SSL: true
    volumes:
      # Volumes nommes : survivent a un `docker compose down` (les anonymes non).
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts/truetype/custom
    expose:
      - '80'
      - '443'
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.onlyoffice.tls.certresolver=myresolver"
      - "traefik.http.routers.onlyoffice.rule=Host(`onlyoffice.$DOMAIN`)"
      - "traefik.http.services.onlyoffice.loadbalancer.server.port=80"
      
      - "traefik.http.routers.onlyoffice.entrypoints=websecure"
      - "traefik.http.routers.onlyoffice.middlewares=onlyoffice-https-redirect"
      - "traefik.http.middlewares.onlyoffice-https-redirect.redirectscheme.scheme=https"

      - "traefik.http.routers.onlyoffice.middlewares=onlyoffice_custom_header"
      - "traefik.http.middlewares.onlyoffice_custom_header.headers.customResponseHeaders.Strict-Transport-Security=max-age=15552000; includeSubDomains; preload;"
      - "traefik.http.middlewares.onlyoffice_custom_header.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.onlyoffice_custom_header.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.onlyoffice_custom_header.headers.browserXssFilter=true"
      - "traefik.http.middlewares.onlyoffice_custom_header.headers.customRequestHeaders.X-Forwarded-Proto=https"
      

networks:
  frontend:
    external: true
  nextcloud_db:
    internal: true

volumes:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_logs:
  onlyoffice_fonts:
