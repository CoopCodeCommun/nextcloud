services:
  nextcloud_db:
    # Version : POSTGRES_TAG du .env. Ne JAMAIS la changer a la main : une image
    # plus recente cree une base vide a cote -> make pg-upgrade PG_CIBLE=19
    image: postgres:${POSTGRES_TAG:?POSTGRES_TAG doit etre renseigne dans .env}-bookworm
    hostname: nextcloud_db
    restart: always
    volumes:               
     # PG >= 18 : /var/lib/postgresql (donnees dans database/18/docker).
     # PG <= 17 : POSTGRES_MOUNT=/var/lib/postgresql/data dans le .env.
     - ./database:${POSTGRES_MOUNT:-/var/lib/postgresql}
    env_file: .env   
    networks:            
      - nextcloud_db      

  nextcloud_redis:
    hostname: nextcloud_redis
    image: redis:7.4
    restart: always
    networks:
      - nextcloud_db

  nextcloud_app:  
    hostname: nextcloud_app
    # Version : NEXTCLOUD_TAG du .env (une majeure : suit ses correctifs).
    # Majeure suivante : make upgrade (une a la fois, apps verifiees).
    image: nextcloud:${NEXTCLOUD_TAG:?NEXTCLOUD_TAG doit etre renseigne dans .env}
    restart: always
    depends_on:
      - nextcloud_db
    volumes:
      - ./data/www/html:/var/www/html
    environment:
      # Pas de fichiers d'exemple dans le dossier des nouveaux utilisateurs
      - NC_skeletondirectory=
    networks:
      - nextcloud_db
      - frontend
    # Option (repris de nextcloud32) : si le serveur ne sait pas se joindre par
    # sa propre IP publique (NAT sans hairpin), faire pointer les noms vers la
    # passerelle du reseau frontend (docker network inspect frontend).
    # A mettre plutot dans docker-compose.override.yml (propre au serveur,
    # ignore par git) : voir le README.
    # extra_hosts:
    #   - "nuage.$DOMAIN:172.18.0.1"
    #   - "onlyoffice.$DOMAIN:172.18.0.1"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      # Noms de routeurs, services et middlewares suffixes par ROUTER_NAME (.env) :
      # plusieurs instances peuvent partager le meme Traefik sans collision.
      - "traefik.http.routers.nextcloud_${ROUTER_NAME:?ROUTER_NAME doit etre renseigne dans .env}.tls.certresolver=myresolver"
      - "traefik.http.routers.nextcloud_${ROUTER_NAME}.rule=Host(`nuage.$DOMAIN`)"
      - "traefik.http.services.nextcloud_${ROUTER_NAME}.loadbalancer.server.port=80"
      # Une seule ligne : deux labels "middlewares" sur le meme router, le second ecrase le premier.
      - "traefik.http.routers.nextcloud_${ROUTER_NAME}.middlewares=nextcloud_custom_header_${ROUTER_NAME}, nextcloud_redirectregex_${ROUTER_NAME}, crowdsec@file"

        # HSTS uniquement. Pas de contentSecurityPolicy ici : Traefik REMPLACERAIT
        # la CSP complete de Nextcloud (qui gere deja frame-ancestors et le
        # frame-src d'OnlyOffice).
      - "traefik.http.middlewares.nextcloud_custom_header_${ROUTER_NAME}.headers.customResponseHeaders.Strict-Transport-Security=max-age=15552000; includeSubDomains; preload;"

        # redirection nécéssaire au desktop client et autres webdav
      - "traefik.http.middlewares.nextcloud_redirectregex_${ROUTER_NAME}.redirectregex.permanent=true"
      - "traefik.http.middlewares.nextcloud_redirectregex_${ROUTER_NAME}.redirectregex.regex=https://(.*)/.well-known/(?:card|cal)dav"
      - "traefik.http.middlewares.nextcloud_redirectregex_${ROUTER_NAME}.redirectregex.replacement=https://$${1}/remote.php/dav"

  onlyoffice:
    hostname: onlyoffice
    # Version : ONLYOFFICE_TAG du .env (10.0 : suit les correctifs 10.0.x).
    # Avant de passer en 10.1 ou 11, verifier que le connecteur (app onlyoffice
    # de Nextcloud) la supporte, puis : make update OO_CONFIRME=1
    image: onlyoffice/documentserver:${ONLYOFFICE_TAG:?ONLYOFFICE_TAG doit etre renseigne dans .env}
    restart: always
    networks:
      - frontend
    # Option (repris de nextcloud32) : si le serveur ne sait pas se joindre par
    # sa propre IP publique (NAT sans hairpin), faire pointer les noms vers la
    # passerelle du reseau frontend (docker network inspect frontend).
    # A mettre plutot dans docker-compose.override.yml (propre au serveur,
    # ignore par git) : voir le README.
    # extra_hosts:
    #   - "nuage.$DOMAIN:172.18.0.1"
    #   - "onlyoffice.$DOMAIN:172.18.0.1"
    environment:
      # Cle partagee avec Nextcloud : la meme valeur est poussee dans l'app
      # onlyoffice par scripts/onlyoffice_connect.sh (make onlyoffice).
      JWT_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit etre renseigne dans .env}
      JWT_HEADER: Authorization
      ENABLE_SSL: true
    volumes:
      # Volumes nommes : survivent a un `docker compose down` (les anonymes non).
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts/truetype/custom
    expose:
      - '80'
      - '443'
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.onlyoffice_${ROUTER_NAME}.tls.certresolver=myresolver"
      - "traefik.http.routers.onlyoffice_${ROUTER_NAME}.rule=Host(`onlyoffice.$DOMAIN`)"
      - "traefik.http.services.onlyoffice_${ROUTER_NAME}.loadbalancer.server.port=80"
      - "traefik.http.routers.onlyoffice_${ROUTER_NAME}.entrypoints=websecure"
      # Une seule ligne middlewares (l'ancienne redirection https etait ecrasee
      # par la suivante, et inutile : l'entrypoint web redirige deja vers websecure).
      - "traefik.http.routers.onlyoffice_${ROUTER_NAME}.middlewares=onlyoffice_custom_header_${ROUTER_NAME}"
      - "traefik.http.middlewares.onlyoffice_custom_header_${ROUTER_NAME}.headers.customResponseHeaders.Strict-Transport-Security=max-age=15552000; includeSubDomains; preload;"
      - "traefik.http.middlewares.onlyoffice_custom_header_${ROUTER_NAME}.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.onlyoffice_custom_header_${ROUTER_NAME}.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.onlyoffice_custom_header_${ROUTER_NAME}.headers.browserXssFilter=true"
      - "traefik.http.middlewares.onlyoffice_custom_header_${ROUTER_NAME}.headers.customRequestHeaders.X-Forwarded-Proto=https"
      

networks:
  frontend:
    external: true
  nextcloud_db:
    internal: true

volumes:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_logs:
  onlyoffice_fonts:
